experiment_name: "EXP-05_deep_ensemble"
ensemble_size: 3
seeds: [42, 43, 44]

data:
  image_size: 512
  batch_size: 16
  num_workers: 4
  splits_csv: "data/processed/patient_splits.csv"
  cache_dir: "data/processed/cache_512x512/"

model:
  architecture: "unet_resnet34"
  in_channels: 3
  num_classes: 1
  pretrained: true
  dropout_rate: 0.0

training:
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0001
  bce_weight: 0.5
  dice_weight: 0.5
  mixed_precision: true
  checkpoint_dir: "checkpoints/ensemble/"

selective_prediction:
  aggregation_method: "top_k"
  top_k: 500
  target_coverages: [0.70, 0.80, 0.90, 1.00]
